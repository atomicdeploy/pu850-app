plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pandcaspian.indicator'
    compileSdk 34

    defaultConfig {
        applicationId "com.pandcaspian.indicator"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:deprecation"
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def capitalizedName = variant.name.capitalize()
        tasks.register("installRun${capitalizedName}", Exec) {
            dependsOn "install${capitalizedName}"
            group = "run"
            description = "Installs and runs the app using Monkey"
            commandLine "adb", "shell", "monkey", "-p", variant.applicationId.get(), "1"
            doLast {
                println "Launching ${variant.applicationId.get()}"
            }
        }
    }
}

tasks.register('turnOnScreen') {
    description = "Turns on the device screen using ADB."
    doLast {
        println("Turning the device screen on")
        exec {
            commandLine "adb", "shell", "input", "keyevent", "KEYCODE_WAKEUP"
        }
        exec {
            commandLine "adb", "shell", "input", "keyevent", "KEYCODE_MENU"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity:1.8.2'
    
    // UI Components
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    
    // Annotations
    annotationProcessor 'org.jetbrains:annotations-java5:15.0'
    
    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.2.0'
    
    // Networking
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    
    // Persian Date Picker
    implementation 'com.github.aliab:Persian-Date-Picker-Dialog:1.8.0'
}
